name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only workflow token: nothing in this workflow writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # `vas` shells out to the system `ssh` and reads key files from the home
    # directory, whose resolution differs on Windows; all three OSes must build
    # and test clean on MSRV (1.88) and stable.
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is pinned: `ubuntu-latest` moved to Ubuntu 26 on 2026-10-19, and a CI run must not
        # turn red (or green) because the image under it changed. Move the pin on purpose, and test
        # the new image in its own job first.
        os: [ubuntu-24.04, windows-latest, macos-latest]
        toolchain: ["1.88", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (v1)
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --check

      # The library alone (no `clap`), as the README advertises.
      - name: Check (no default features)
        run: cargo check --locked --no-default-features

      # Both configurations, as hypomnesis does: the library alone (no `clap`; `vas` requires
      # `cli` and is skipped), then everything.
      - name: Clippy (library only)
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # The API tests run against a local mock server: no network, no key.
      - name: Tests
        run: cargo test --locked --all-features

  doc:
    name: Doc check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (v1)
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Doc check
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  # Dependency supply chain, per `deny.toml`. Build scripts and
  # proc-macros run arbitrary code at build time, so a compromised or yanked
  # dependency is worth failing the build over.
  deny:
    name: "Dependencies (cargo-deny)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
