[package]
name = "vast-skopos"
version = "0.4.0"
edition = "2024"
authors = ["Eric Jacopin"]
description = "A lookout over your rented vast.ai boxes: status, cost, credit, and what the GPU is actually doing (over ssh). Not affiliated with vast.ai."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mi-for-the-rust-of-us/vast-skopos"
homepage = "https://github.com/mi-for-the-rust-of-us/vast-skopos"
documentation = "https://docs.rs/vast-skopos"
readme = "README.md"
keywords = ["vast-ai", "gpu", "cloud", "monitoring", "cli"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.88"
# Repository tooling and the maintainer's working notes stay out of the published crate.
exclude = [".github/", "deny.toml", "docs/dogfooding/", "docs/audits/"]

[dependencies]
thiserror = "2"
serde_json = "1"
# HTTPS client for the vast.ai API: blocking, small, rustls by default.
ureq = { version = "3", features = ["json"] }

# Optional: clap CLI parser for the `vas` binary (cli feature only).
clap = { version = "4", optional = true, features = ["derive"] }

[features]
# `cli` is default-on so `cargo install vast-skopos` installs `vas` out of the box, as `hmn` does
# for hypomnesis. Library-only consumers pass `--no-default-features`.
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "vas"
required-features = ["cli"]

# The binary's own tests run the binary, so they need it built.
[[test]]
name = "offers_cli"
required-features = ["cli"]

[[test]]
name = "look_cli"
required-features = ["cli"]

[lints.rust]
elided_lifetimes_in_paths = "deny"
missing_docs              = "warn"
unsafe_code               = "forbid"
# The MSRV lint guard (CONVENTIONS.md, after hypomnesis): an `allow` of a clippy lint newer than the
# MSRV (1.88) names a lint that toolchain does not know, which `-D warnings` would turn into a failed
# MSRV build. Here, not in `lib.rs`: the tests and `vas` are crates of their own and need it too.
unknown_lints             = "allow"

[lints.clippy]
# Rule 3: No panics or indexing in library code
unwrap_used               = "deny"
expect_used               = "deny"
panic                     = "deny"
indexing_slicing          = "deny"

# Rule 7: Exhaustive matching
wildcard_enum_match_arm             = "deny"
match_wildcard_for_single_variants  = "deny"

# Rule 11: #[non_exhaustive] policy
exhaustive_enums          = "warn"

# Rule 2: Explicit conversions (warn — numeric casts need annotation, not prohibition)
as_conversions            = "warn"
cast_possible_truncation  = "warn"
cast_precision_loss       = "warn"
cast_sign_loss            = "warn"

# Rule 9: Prefer iterators
explicit_iter_loop        = "warn"
manual_filter_map         = "warn"
manual_find_map           = "warn"
needless_range_loop       = "warn"

# Documentation
missing_docs_in_private_items = "warn"
missing_errors_doc        = "warn"
missing_panics_doc        = "warn"

# General pedantic + nursery quality baseline
pedantic  = { level = "warn", priority = -1 }
nursery   = { level = "warn", priority = -1 }

# Suppressed lints that are too noisy for this domain
module_name_repetitions   = "allow"
too_many_lines            = "allow"
must_use_candidate        = "warn"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
